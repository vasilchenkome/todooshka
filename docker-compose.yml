name: todooshka

services:
  app:
    image: ghcr.io/vasilchenkome/todooshka:${TODOOSHKA_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite:///data/todooshka.db
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: json
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    expose:
      - "8080"
    volumes:
      - todooshka-data:/data
    healthcheck:
      test: ["CMD", "todooshka", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TODOOSHKA_DOMAIN: ${TODOOSHKA_DOMAIN:-todooshka.local}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  todooshka-data:
  caddy-data:
  caddy-config:
