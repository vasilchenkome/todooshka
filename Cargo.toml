[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/sqlite",
    "crates/http",
    "crates/bin",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["vasilchenkome <kirill@vasilchenko.me>"]

[workspace.dependencies]
# Внутренние крейты: зависимости направлены только внутрь.
todooshka-domain = { path = "crates/domain" }
todooshka-app = { path = "crates/application" }
todooshka-sqlite = { path = "crates/sqlite" }
todooshka-http = { path = "crates/http" }

# Внешние зависимости: версии фиксируются Cargo.lock.
argon2 = "0.6"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
hex = "0.4"
rpassword = "7"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tower-http = { version = "0.7", features = ["timeout"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
